name: CI

# Runs on every branch and on PRs into both integration branches.
#
# CLAUDE.md requires CI to be green *before* a phase branch opens a PR into
# `features`, and phases are built in parallel by separate sessions. Limiting
# triggers to main/features would mean a phase branch got no CI at all until
# its PR was already open, and a PR into `features` would never run checks —
# so the gate the branch policy depends on would not exist.
#
# No local Android Studio is required; this pipeline is the only thing that
# has to build the app (architecture doc section 4).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, features]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test the brain layer
        run: gradle testDebugUnitTest --stacktrace

      # Gradle prints per-test detail only on failure, and the console log is
      # awkward to read across parallel phase branches. Keep the HTML report.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.ref_name }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scope-wa-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
