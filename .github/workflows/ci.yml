name: CI

# Runs on every push to features/main and every PR into either of them — see
# CLAUDE.md's branch policy, which requires green CI before a phase branch is
# merged into `features`. `workflow_dispatch` lets a phase branch be checked
# before its PR is opened. No local Android Studio is required; this pipeline is
# the only thing that has to build the app (architecture doc section 4).
on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main, features]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test the pure-Kotlin layers
        run: gradle testDebugUnitTest --stacktrace

      # Uploaded even when the tests fail — that's when the report is worth
      # having, and there's no local Android Studio to reproduce a failure in.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scope-wa-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
